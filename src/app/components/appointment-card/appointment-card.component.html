<div class="appointment-card" (click)="onCardClick()">
  <div class="card-header">
    <div class="day-info">
      <span 
        class="day-indicator" 
        [class.work-indicator]="appointment().category === 'work'"
        [class.home-indicator]="appointment().category === 'home'"
      ></span>
      <span class="day-name">{{ getDayOfWeek() }}</span>
    </div>
    <span class="appointment-time">{{ getFormattedTime() }}</span>
  </div>

  <div class="card-body">
    <h3 class="practitioner-name">{{ appointment().title }}</h3>
    <p class="appointment-type">{{ appointment().notes || 'No description' }}</p>
  </div>

  <div class="card-footer">
    <button 
      nz-button 
      nzType="text" 
      class="reschedule-btn"
      (click)="onRescheduleClick($event)"
    >
      Reschedule
    </button>
  </div>
</div>
